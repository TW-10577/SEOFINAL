apiVersion: logos.ontology/v0.0.1
kind: ActionType
metadata:
  id: logos.seo.action.analyze-seo-performance
  apiName: AnalyzeSEOPerformance
  displayName:
    en: Analyze SEO Performance
    ja: SEO パフォーマンスの分析
  description:
    en: A3. Compares the current week with the previous week per analysis unit and metric; absolute change and change rate
      are calculated values, not objects.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §5 A3
    logos.ext/performed-by: System
spec:
  target:
    targetTypeRef: logos.seo.object.seo-data
    targetMode: existing_instance
  inputs:
    - inputId: previous-data
      apiName: previousData
      description:
        en: SEO Data of the same unit and metric for the previous week.
      typeRef: logos.seo.object.seo-data
      required: true
  riskLevel: low
  authorizationPolicyBindings:
    - bindingId: primary-authorization
      policyRef: logos.seo.policy.seo-system-execution
  approval:
    mode: none
    reapprovalOnChange:
      - input
    recordComments: true
  effects:
    - effectId: link-previous
      effectKind: add_relation
      targetExpression: logos.seo.relation.seo-data-compared-with
      atomicGroup: analyze
  idempotency:
    keyExpression: concat(action.id, ':', target.id, ':', request.id)
    scope: target_action
    retention: P30D
    onDuplicate: return_original_receipt
    inputMismatchBehavior: reject
    inputHashRequired: true
  concurrency:
    strategy: optimistic_version
    tokenExpression: target.version
    onConflict: reject
    maxRetries: 0
  execution:
    executionMode: internal_atomic
  failure:
    failureClasses:
      - validation
      - authorization
      - concurrency
      - unknown
    retryableClasses: []
    compensationMode: manual_recovery
    unknownResultPolicy: freeze_and_escalate
  receipt:
    required: true
  observation:
    required: true
    strategy: read_back_after_commit
    deadline: PT30S
  reconciliation:
    strategy: typed_comparison
    successCriteria:
      - target.qualityStatus == 'VALID'
    onUnknown: freeze_and_escalate
  security:
    classification: internal
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
      - action
      - relation_change
    recordBeforeAfter: true
    recordInputHash: true
    recordEvidenceRefs: true
    recordReleaseRefs: true
    recordActionChain: true
    integrityMode: hash_chain
    retentionPolicyRef: logos.seo.policy.audit-retention
