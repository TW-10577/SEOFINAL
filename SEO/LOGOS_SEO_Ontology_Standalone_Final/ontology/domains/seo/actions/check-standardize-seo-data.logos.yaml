apiVersion: logos.ontology/v0.0.1
kind: ActionType
metadata:
  id: logos.seo.action.check-standardize-seo-data
  apiName: CheckStandardizeSEOData
  displayName:
    en: Check and Standardize Data
    ja: データのチェックと標準化
  description:
    en: A2. Validates column names, dates, URLs, units, missing values and duplicates; a value that fails is marked INVALID
      and is never used in analysis.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §5 A2
    logos.ext/performed-by: System
spec:
  target:
    targetTypeRef: logos.seo.object.seo-data
    targetMode: existing_instance
  inputs:
    - inputId: quality-status
      apiName: qualityStatus
      description:
        en: VALID or INVALID.
      typeRef: logos.seo.value.data-quality-status
      required: true
  riskLevel: low
  authorizationPolicyBindings:
    - bindingId: primary-authorization
      policyRef: logos.seo.policy.seo-system-execution
  approval:
    mode: none
    reapprovalOnChange:
      - input
    recordComments: true
  effects:
    - effectId: set-quality
      effectKind: update_property
      propertyRef: "#property/quality-status"
      valueExpression: input.qualityStatus
      atomicGroup: check
  idempotency:
    keyExpression: concat(action.id, ':', target.id, ':', request.id)
    scope: target_action
    retention: P30D
    onDuplicate: return_original_receipt
    inputMismatchBehavior: reject
    inputHashRequired: true
  concurrency:
    strategy: optimistic_version
    tokenExpression: target.version
    onConflict: reject
    maxRetries: 0
  execution:
    executionMode: internal_atomic
  failure:
    failureClasses:
      - validation
      - authorization
      - concurrency
      - unknown
    retryableClasses: []
    compensationMode: manual_recovery
    unknownResultPolicy: freeze_and_escalate
  receipt:
    required: true
  observation:
    required: true
    strategy: read_back_after_commit
    deadline: PT30S
  reconciliation:
    strategy: typed_comparison
    successCriteria:
      - target.qualityStatus == input.qualityStatus
    onUnknown: freeze_and_escalate
  security:
    classification: internal
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
      - action
      - property_change
    recordBeforeAfter: true
    recordInputHash: true
    recordEvidenceRefs: true
    recordReleaseRefs: true
    recordActionChain: true
    integrityMode: hash_chain
    retentionPolicyRef: logos.seo.policy.audit-retention
