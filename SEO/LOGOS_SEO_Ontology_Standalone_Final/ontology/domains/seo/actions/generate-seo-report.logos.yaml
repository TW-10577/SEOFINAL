apiVersion: logos.ontology/v0.0.1
kind: ActionType
metadata:
  id: logos.seo.action.generate-seo-report
  apiName: GenerateSEOReport
  displayName:
    en: Generate SEO Report
    ja: SEO レポートの生成
  description:
    en: A9. Produces the weekly monitoring report as a generated view of database records (aggregation, measurement results,
      anomalies, causes, countermeasures, decisions, data-quality warnings). The report is not a persistent ontology
      object.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §5 A9
    logos.ext/performed-by: System
spec:
  target:
    targetTypeRef: logos.seo.object.seo-anomaly
    targetMode: collection
  riskLevel: low
  authorizationPolicyBindings:
    - bindingId: primary-authorization
      policyRef: logos.seo.policy.seo-system-execution
  approval:
    mode: none
    reapprovalOnChange:
      - input
    recordComments: true
  effects:
    - effectId: render-view
      effectKind: no_effect
      atomicGroup: report
  idempotency:
    keyExpression: concat(action.id, ':', target.id, ':', request.id)
    scope: target_action
    retention: P30D
    onDuplicate: return_original_receipt
    inputMismatchBehavior: reject
    inputHashRequired: true
  concurrency:
    strategy: optimistic_version
    tokenExpression: target.version
    onConflict: reject
    maxRetries: 0
  execution:
    executionMode: internal_atomic
  failure:
    failureClasses:
      - validation
      - authorization
      - concurrency
      - unknown
    retryableClasses: []
    compensationMode: manual_recovery
    unknownResultPolicy: freeze_and_escalate
  receipt:
    required: true
  observation:
    required: true
    strategy: read_back_after_commit
    deadline: PT30S
  reconciliation:
    strategy: typed_comparison
    successCriteria:
      - "true"
    onUnknown: freeze_and_escalate
  security:
    classification: internal
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
      - action
      - query
    recordBeforeAfter: true
    recordInputHash: true
    recordEvidenceRefs: true
    recordReleaseRefs: true
    recordActionChain: true
    integrityMode: hash_chain
    retentionPolicyRef: logos.seo.policy.audit-retention
