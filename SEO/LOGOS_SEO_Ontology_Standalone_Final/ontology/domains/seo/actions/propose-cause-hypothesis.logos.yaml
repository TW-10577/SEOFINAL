apiVersion: logos.ontology/v0.0.1
kind: ActionType
metadata:
  id: logos.seo.action.propose-cause-hypothesis
  apiName: ProposeCauseHypothesis
  displayName:
    en: Propose Cause Hypothesis
    ja: 原因仮説の提案
  description:
    en: A6. Suggests a possible cause from the client rule's What to Check Next and the available evidence (GSC only as
      supporting evidence for rule ① when organic traffic decreases). Created NOT_REVIEWED; never confirmed by the
      system.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §5 A6
    logos.ext/performed-by: System
spec:
  target:
    targetTypeRef: logos.seo.object.cause-hypothesis
    targetMode: create_instance
  inputs:
    - inputId: hypothesis-text
      apiName: hypothesisText
      description:
        en: Possible cause.
      typeRef: logos.seo.value.cause-text
      required: true
    - inputId: supporting-evidence
      apiName: supportingEvidence
      description:
        en: Numbers and observations used.
      typeRef: logos.seo.value.seo-text
      required: true
    - inputId: confidence
      apiName: confidence
      description:
        en: High / Medium / Low.
      typeRef: logos.seo.value.confidence-level
      required: true
    - inputId: anomaly
      apiName: anomaly
      description:
        en: The anomaly the hypothesis explains.
      typeRef: logos.seo.object.seo-anomaly
      required: true
  riskLevel: medium
  authorizationPolicyBindings:
    - bindingId: primary-authorization
      policyRef: logos.seo.policy.seo-system-execution
  approval:
    mode: none
    reapprovalOnChange:
      - input
    recordComments: true
  effects:
    - effectId: create
      effectKind: create_object
      targetExpression: logos.seo.object.cause-hypothesis
      atomicGroup: propose
    - effectId: set-text
      effectKind: update_property
      propertyRef: "#property/hypothesis-text"
      valueExpression: input.hypothesisText
      atomicGroup: propose
    - effectId: set-evidence
      effectKind: update_property
      propertyRef: "#property/supporting-evidence"
      valueExpression: input.supportingEvidence
      atomicGroup: propose
    - effectId: set-confidence
      effectKind: update_property
      propertyRef: "#property/confidence"
      valueExpression: input.confidence
      atomicGroup: propose
    - effectId: link-anomaly
      effectKind: add_relation
      targetExpression: logos.seo.relation.cause-explains-anomaly
      atomicGroup: propose
  idempotency:
    keyExpression: concat(action.id, ':', target.id, ':', request.id)
    scope: target_action
    retention: P30D
    onDuplicate: return_original_receipt
    inputMismatchBehavior: reject
    inputHashRequired: true
  concurrency:
    strategy: optimistic_version
    tokenExpression: target.version
    onConflict: reject
    maxRetries: 0
  execution:
    executionMode: internal_atomic
  failure:
    failureClasses:
      - validation
      - authorization
      - concurrency
      - unknown
    retryableClasses: []
    compensationMode: manual_recovery
    unknownResultPolicy: freeze_and_escalate
  receipt:
    required: true
  observation:
    required: true
    strategy: read_back_after_commit
    deadline: PT30S
  reconciliation:
    strategy: typed_comparison
    successCriteria:
      - target.reviewStatus == 'NOT_REVIEWED'
    onUnknown: freeze_and_escalate
  security:
    classification: internal
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
      - action
      - property_change
      - relation_change
    recordBeforeAfter: true
    recordInputHash: true
    recordEvidenceRefs: true
    recordReleaseRefs: true
    recordActionChain: true
    integrityMode: hash_chain
    retentionPolicyRef: logos.seo.policy.audit-retention
