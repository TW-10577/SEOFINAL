apiVersion: logos.ontology/v0.0.1
kind: ObjectType
metadata:
  id: logos.seo.object.cause-hypothesis
  apiName: CauseHypothesis
  displayName:
    en: Cause Hypothesis
    ja: 原因仮説
  description:
    en: "A possible explanation for an anomaly, generated from the client rule's What to Check Next and the available
      evidence. A suggestion only: the SEO team confirms, rejects or asks for more evidence."
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §6 O9, §8 human review status
spec:
  semanticKind: business_concept
  identity:
    strategy: system_generated
    primaryPropertyRef: "#property/cause-id"
  titlePropertyRef: "#property/hypothesis-text"
  properties:
    - memberId: cause-id
      apiName: causeId
      displayName:
        en: Cause ID
        ja: 原因 ID
      description:
        en: System-generated identifier.
      valueTypeRef: logos.seo.value.seo-id
      valueMode: stored
      required: true
      nullable: false
      immutable: true
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: high
    - memberId: hypothesis-text
      apiName: hypothesisText
      displayName:
        en: Hypothesis
        ja: 仮説
      description:
        en: The possible cause in words.
      valueTypeRef: logos.seo.value.cause-text
      valueMode: stored
      required: true
      nullable: false
      writableByActionRefs:
        - logos.seo.action.propose-cause-hypothesis
        - logos.seo.action.amend-cause-hypothesis
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: medium
    - memberId: supporting-evidence
      apiName: supportingEvidence
      displayName:
        en: Supporting Evidence
        ja: 裏付けとなる根拠
      description:
        en: The numbers and observations the hypothesis rests on (e.g. organic and advertising session changes, GSC evidence).
      valueTypeRef: logos.seo.value.seo-text
      valueMode: stored
      required: true
      nullable: false
      writableByActionRefs:
        - logos.seo.action.propose-cause-hypothesis
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: medium
    - memberId: confidence
      apiName: confidence
      displayName:
        en: Confidence
        ja: 信頼度
      description:
        en: High / Medium / Low, as defined on the value type.
      valueTypeRef: logos.seo.value.confidence-level
      valueMode: stored
      required: true
      nullable: false
      writableByActionRefs:
        - logos.seo.action.propose-cause-hypothesis
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: medium
    - memberId: review-status
      apiName: reviewStatus
      displayName:
        en: Review Status
        ja: レビュー状況
      description:
        en: SEO team review. Never set to CONFIRMED by the system.
      valueTypeRef: logos.seo.value.human-review-status
      valueMode: stored
      required: true
      nullable: false
      writableByActionRefs:
        - logos.seo.action.confirm-cause
        - logos.seo.action.reject-cause
        - logos.seo.action.request-more-evidence
        - logos.seo.action.confirm-cause-after-evidence
        - logos.seo.action.reject-cause-after-evidence
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: high
  lifecycle:
    statePropertyRef: "#property/review-status"
    states:
      - code: NOT_REVIEWED
        displayName:
          en: Not Reviewed
          ja: 未レビュー
        description:
          en: Generated by the system; not yet reviewed. The initial state.
        initial: true
        allowedActionRefs:
          - logos.seo.action.confirm-cause
          - logos.seo.action.reject-cause
          - logos.seo.action.request-more-evidence
          - logos.seo.action.amend-cause-hypothesis
      - code: NEEDS_MORE_EVIDENCE
        displayName:
          en: Needs More Evidence
          ja: 追加根拠が必要
        description:
          en: The SEO team needs more evidence before deciding.
        allowedActionRefs:
          - logos.seo.action.confirm-cause-after-evidence
          - logos.seo.action.reject-cause-after-evidence
          - logos.seo.action.amend-cause-hypothesis
      - code: CONFIRMED
        displayName:
          en: Confirmed
          ja: 確認済
        description:
          en: Confirmed by the SEO team. The only state in which the cause may be cited as established.
        terminal: true
        citable: true
      - code: REJECTED
        displayName:
          en: Rejected
          ja: 却下
        description:
          en: Rejected by the SEO team. Terminal.
        terminal: true
    transitions:
      - transitionId: confirm
        fromState: NOT_REVIEWED
        toState: CONFIRMED
        actionRef: logos.seo.action.confirm-cause
      - transitionId: reject
        fromState: NOT_REVIEWED
        toState: REJECTED
        actionRef: logos.seo.action.reject-cause
      - transitionId: request-more-evidence
        fromState: NOT_REVIEWED
        toState: NEEDS_MORE_EVIDENCE
        actionRef: logos.seo.action.request-more-evidence
      - transitionId: confirm-after-evidence
        fromState: NEEDS_MORE_EVIDENCE
        toState: CONFIRMED
        actionRef: logos.seo.action.confirm-cause-after-evidence
      - transitionId: reject-after-evidence
        fromState: NEEDS_MORE_EVIDENCE
        toState: REJECTED
        actionRef: logos.seo.action.reject-cause-after-evidence
    deletionMode: archive
  sourceAuthorityDefault:
    authorityKind: internal
    retainCandidates: true
  temporal:
    mode: none
  security:
    classification: internal
    tenantScope: organization
    policyCombining: deny_overrides
    readPolicyRefs:
      - logos.seo.policy.internal-reader
    queryPolicyRefs:
      - logos.seo.policy.internal-reader
    executionPolicyRefs:
      - logos.seo.policy.seo-system-execution
      - logos.seo.policy.can-review-seo-outcome
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
      - query
      - property_change
      - action
      - lifecycle
      - evidence
    recordBeforeAfter: true
    recordEvidenceRefs: true
    recordReleaseRefs: true
    integrityMode: hash_chain
