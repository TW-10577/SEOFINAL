apiVersion: logos.ontology/v0.0.1
kind: ObjectType
metadata:
  id: logos.seo.object.judgment-condition
  apiName: JudgmentCondition
  displayName:
    en: Judgment Condition
    ja: 判定条件
  description:
    en: A business rule that decides whether a change is significant. Thresholds are supplied or approved by the SEO team;
      the PoC conditions are the client rules ① and ② in SEO.txt, configured in rules.yaml.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §6 O7
spec:
  semanticKind: business_concept
  identity:
    strategy: source_bound
    primaryPropertyRef: "#property/condition-id"
  titlePropertyRef: "#property/condition-name"
  properties:
    - memberId: condition-id
      apiName: conditionId
      displayName:
        en: Condition ID
        ja: 条件 ID
      description:
        en: Identifier from the rule configuration (rules.yaml), e.g. GA4-R1.
      valueTypeRef: logos.seo.value.seo-string
      valueMode: stored
      required: true
      nullable: false
      immutable: true
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: high
    - memberId: condition-name
      apiName: conditionName
      displayName:
        en: Condition Name
        ja: 条件名
      description:
        en: e.g. Traffic Acquisition — Sessions.
      valueTypeRef: logos.seo.value.seo-string
      valueMode: stored
      required: true
      nullable: false
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: medium
    - memberId: metric
      apiName: metric
      displayName:
        en: Metric
        ja: 指標
      description:
        en: Metric the condition watches, e.g. sessions or cvr.
      valueTypeRef: logos.seo.value.seo-string
      valueMode: stored
      required: true
      nullable: false
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: medium
    - memberId: direction
      apiName: direction
      displayName:
        en: Direction
        ja: 方向
      description:
        en: Increase, decrease or both (±).
      valueTypeRef: logos.seo.value.change-direction
      valueMode: stored
      required: true
      nullable: false
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: medium
    - memberId: threshold-value
      apiName: thresholdValue
      displayName:
        en: Threshold Value
        ja: 閾値
      description:
        en: Threshold, e.g. 3.9. NULL means not configured, so the condition is NOT_EVALUABLE.
      valueTypeRef: logos.seo.value.threshold-value
      valueMode: stored
      required: false
      nullable: true
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: medium
    - memberId: unit
      apiName: unit
      displayName:
        en: Threshold Unit
        ja: 閾値の単位
      description:
        en: Percent (relative change), percentage points, or UNRESOLVED when the client has not confirmed it.
      valueTypeRef: logos.seo.value.threshold-unit
      valueMode: stored
      required: true
      nullable: false
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: medium
    - memberId: condition-type
      apiName: conditionType
      displayName:
        en: Condition Type
        ja: 条件タイプ
      description:
        en: Numeric or ambiguous (ECM-05).
      valueTypeRef: logos.seo.value.condition-type
      valueMode: stored
      required: true
      nullable: false
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: medium
  sourceAuthorityDefault:
    authorityKind: internal
    retainCandidates: true
  temporal:
    mode: none
  security:
    classification: internal
    tenantScope: organization
    policyCombining: deny_overrides
    readPolicyRefs:
      - logos.seo.policy.internal-reader
    queryPolicyRefs:
      - logos.seo.policy.internal-reader
    executionPolicyRefs:
      - logos.seo.policy.seo-system-execution
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
      - query
      - property_change
      - action
      - evidence
    recordBeforeAfter: true
    recordEvidenceRefs: true
    recordReleaseRefs: true
    integrityMode: hash_chain
