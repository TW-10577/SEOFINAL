apiVersion: logos.ontology/v0.0.1
kind: ObjectType
metadata:
  id: logos.seo.object.search-query
  apiName: SearchQuery
  displayName:
    en: Search Query
    ja: 検索クエリ
  description:
    en: A search keyword bringing traffic to the site — the Search Console unit of analysis.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §6 O1
spec:
  semanticKind: business_concept
  identity:
    strategy: source_bound
    primaryPropertyRef: "#property/query-text"
  titlePropertyRef: "#property/query-text"
  properties:
    - memberId: query-text
      apiName: queryText
      displayName:
        en: Query Text
        ja: クエリ
      description:
        en: The query exactly as exported by Search Console.
      valueTypeRef: logos.seo.value.search-query
      valueMode: stored
      required: true
      nullable: false
      immutable: true
      sensitivity: internal
      sourceBindingRefs:
        - logos.seo.binding.gsc-csv
      sourceAuthority:
        authorityKind: external
        primarySourceRef: file:gsc-csv
        retainCandidates: true
        riskLevel: high
    - memberId: brand-division
      apiName: brandDivision
      displayName:
        en: Brand Division
        ja: ブランド区分
      description:
        en: Own-brand or generic. Classification rule not yet supplied by the client (a provisional term list reproduces the 66%
          in SEO.txt).
      valueTypeRef: logos.seo.value.brand-division
      valueMode: stored
      required: false
      nullable: true
      writableByActionRefs:
        - logos.seo.action.receive-seo-data
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: medium
    - memberId: category-division
      apiName: categoryDivision
      displayName:
        en: Category Division
        ja: カテゴリ区分
      description:
        en: Category division. No master exists yet.
      valueTypeRef: logos.seo.value.category-division
      valueMode: stored
      required: false
      nullable: true
      writableByActionRefs:
        - logos.seo.action.receive-seo-data
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: medium
  sourceAuthorityDefault:
    authorityKind: external
    primarySourceRef: file:gsc-csv
    retainCandidates: true
  temporal:
    mode: none
  security:
    classification: internal
    tenantScope: organization
    policyCombining: deny_overrides
    readPolicyRefs:
      - logos.seo.policy.internal-reader
    queryPolicyRefs:
      - logos.seo.policy.internal-reader
    executionPolicyRefs:
      - logos.seo.policy.seo-system-execution
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
      - query
      - property_change
      - action
      - evidence
    recordBeforeAfter: true
    recordEvidenceRefs: true
    recordReleaseRefs: true
    integrityMode: hash_chain
