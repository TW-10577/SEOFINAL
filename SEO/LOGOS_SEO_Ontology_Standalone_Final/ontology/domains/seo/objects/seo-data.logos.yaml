apiVersion: logos.ontology/v0.0.1
kind: ObjectType
metadata:
  id: logos.seo.object.seo-data
  apiName: SEOData
  displayName:
    en: SEO Data
    ja: SEO データ
  description:
    en: One set of metric values for one analysis unit in one period, standardized from an uploaded export. Every value
      traces back to its source rows.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §6 O6
spec:
  semanticKind: business_concept
  identity:
    strategy: system_generated
    primaryPropertyRef: "#property/seo-data-id"
  titlePropertyRef: "#property/seo-data-id"
  properties:
    - memberId: seo-data-id
      apiName: seoDataId
      displayName:
        en: SEO Data ID
        ja: SEO データ ID
      description:
        en: System-generated identifier.
      valueTypeRef: logos.seo.value.seo-id
      valueMode: stored
      required: true
      nullable: false
      immutable: true
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: high
    - memberId: sessions
      apiName: sessions
      displayName:
        en: Sessions
        ja: セッション
      description:
        en: GA4 sessions.
      valueTypeRef: logos.seo.value.sessions
      valueMode: stored
      required: false
      nullable: true
      sensitivity: internal
      sourceBindingRefs:
        - logos.seo.binding.ga4-csv
      sourceAuthority:
        authorityKind: external
        primarySourceRef: file:ga4-csv
        retainCandidates: true
        riskLevel: medium
    - memberId: impressions
      apiName: impressions
      displayName:
        en: Impressions
        ja: 表示回数
      description:
        en: Search Console impressions.
      valueTypeRef: logos.seo.value.impressions
      valueMode: stored
      required: false
      nullable: true
      sensitivity: internal
      sourceBindingRefs:
        - logos.seo.binding.gsc-csv
      sourceAuthority:
        authorityKind: external
        primarySourceRef: file:gsc-csv
        retainCandidates: true
        riskLevel: medium
    - memberId: clicks
      apiName: clicks
      displayName:
        en: Clicks
        ja: クリック数
      description:
        en: Search Console clicks.
      valueTypeRef: logos.seo.value.clicks
      valueMode: stored
      required: false
      nullable: true
      sensitivity: internal
      sourceBindingRefs:
        - logos.seo.binding.gsc-csv
      sourceAuthority:
        authorityKind: external
        primarySourceRef: file:gsc-csv
        retainCandidates: true
        riskLevel: medium
    - memberId: ctr
      apiName: ctr
      displayName:
        en: CTR
        ja: CTR
      description:
        en: Click-through rate as exported; recomputed from clicks and impressions for analysis.
      valueTypeRef: logos.seo.value.ctr
      valueMode: stored
      required: false
      nullable: true
      sensitivity: internal
      sourceBindingRefs:
        - logos.seo.binding.gsc-csv
      sourceAuthority:
        authorityKind: external
        primarySourceRef: file:gsc-csv
        retainCandidates: true
        riskLevel: medium
    - memberId: average-position
      apiName: averagePosition
      displayName:
        en: Average Position
        ja: 平均掲載順位
      description:
        en: Average ranking position.
      valueTypeRef: logos.seo.value.average-position
      valueMode: stored
      required: false
      nullable: true
      sensitivity: internal
      sourceBindingRefs:
        - logos.seo.binding.gsc-csv
      sourceAuthority:
        authorityKind: external
        primarySourceRef: file:gsc-csv
        retainCandidates: true
        riskLevel: medium
    - memberId: conversions
      apiName: conversions
      displayName:
        en: Conversions (CV)
        ja: CV
      description:
        en: GA4 conversions.
      valueTypeRef: logos.seo.value.conversions
      valueMode: stored
      required: false
      nullable: true
      sensitivity: internal
      sourceBindingRefs:
        - logos.seo.binding.ga4-csv
      sourceAuthority:
        authorityKind: external
        primarySourceRef: file:ga4-csv
        retainCandidates: true
        riskLevel: medium
    - memberId: cvr
      apiName: cvr
      displayName:
        en: CVR
        ja: CVR
      description:
        en: CV ÷ sessions × 100, calculated.
      valueTypeRef: logos.seo.value.cvr
      valueMode: derived
      required: false
      nullable: true
      derivedBy: logos.seo.function.compute-cvr
      sensitivity: internal
    - memberId: data-source
      apiName: dataSource
      displayName:
        en: Data Source
        ja: データソース
      description:
        en: GA4 or Search Console.
      valueTypeRef: logos.seo.value.data-source
      valueMode: stored
      required: true
      nullable: false
      writableByActionRefs:
        - logos.seo.action.receive-seo-data
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: medium
    - memberId: export-condition
      apiName: exportCondition
      displayName:
        en: Export Condition
        ja: エクスポート条件
      description:
        en: "Filters and settings recorded with the export (e.g. Search Console search type and date range). ECM-04: figures
          change with export conditions."
      valueTypeRef: logos.seo.value.seo-text
      valueMode: stored
      required: false
      nullable: true
      sensitivity: internal
      sourceBindingRefs:
        - logos.seo.binding.gsc-csv
      sourceAuthority:
        authorityKind: external
        primarySourceRef: file:gsc-csv
        retainCandidates: true
        riskLevel: medium
    - memberId: quality-status
      apiName: qualityStatus
      displayName:
        en: Data Quality
        ja: データ品質
      description:
        en: Result of Check and Standardize. Invalid values are kept for traceability but never used in analysis.
      valueTypeRef: logos.seo.value.data-quality-status
      valueMode: stored
      required: true
      nullable: false
      writableByActionRefs:
        - logos.seo.action.receive-seo-data
        - logos.seo.action.check-standardize-seo-data
      sensitivity: internal
      sourceAuthority:
        authorityKind: internal
        retainCandidates: true
        riskLevel: medium
  sourceAuthorityDefault:
    authorityKind: internal
    retainCandidates: true
  temporal:
    mode: none
  evidenceRequirements:
    - evidenceTypeRef: logos.seo.evidence.source-record
      minimumCount: 1
      onMissing: mark_unknown
  security:
    classification: internal
    tenantScope: organization
    policyCombining: deny_overrides
    readPolicyRefs:
      - logos.seo.policy.internal-reader
    queryPolicyRefs:
      - logos.seo.policy.internal-reader
    executionPolicyRefs:
      - logos.seo.policy.seo-system-execution
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
      - query
      - property_change
      - action
      - evidence
    recordBeforeAfter: true
    recordEvidenceRefs: true
    recordReleaseRefs: true
    integrityMode: hash_chain
