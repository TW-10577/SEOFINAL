apiVersion: logos.ontology/v0.0.1
kind: RelationType
metadata:
  id: logos.seo.relation.anomaly-based-on
  apiName: AnomalyBasedOn
  displayName:
    en: SEO Anomaly BASED_ON SEO Data
    ja: SEO 異常 BASED_ON SEO データ
  description:
    en: The metric values that are the evidence of the anomaly.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §7 R9
spec:
  accessors:
    - accessorId: forward
      fromTypeRef: logos.seo.object.seo-anomaly
      apiName: evidenceData
      displayName:
        en: Evidence Data
        ja: 根拠データ
      description:
        en: The metric values that are the evidence of the anomaly.
      returnsTypeRef: logos.seo.object.seo-data
      cardinality: 1..*
    - accessorId: inverse
      fromTypeRef: logos.seo.object.seo-data
      apiName: anomalies
      displayName:
        en: SEO Anomalies
        ja: SEO 異常
      description:
        en: The metric values that are the evidence of the anomaly.
      returnsTypeRef: logos.seo.object.seo-anomaly
      cardinality: 0..*
  canonicalDirection:
    fromAccessorId: forward
    toAccessorId: inverse
  relationMode: stored
  lifecycle:
    ownership: reference
    onFromDelete: restrict
    onToDelete: restrict
    orphanPolicy: reject
  temporal:
    mode: none
  security:
    classification: internal
  audit:
    enabled: true
    eventCategories:
      - relation_change
    recordBeforeAfter: true
    recordReleaseRefs: true
