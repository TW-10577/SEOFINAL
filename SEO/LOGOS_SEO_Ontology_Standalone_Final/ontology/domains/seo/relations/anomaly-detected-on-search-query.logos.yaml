apiVersion: logos.ontology/v0.0.1
kind: RelationType
metadata:
  id: logos.seo.relation.anomaly-detected-on-search-query
  apiName: AnomalyDetectedOnSearchQuery
  displayName:
    en: SEO Anomaly DETECTED_ON Search Query
    ja: SEO 異常 DETECTED_ON 検索クエリ
  description:
    en: The anomaly belongs to this search query. Exactly one DETECTED_ON relation exists per anomaly, matching its subject
      type.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §7 R8 (split per subject type)
spec:
  accessors:
    - accessorId: forward
      fromTypeRef: logos.seo.object.seo-anomaly
      apiName: detectedOnSearchQuery
      displayName:
        en: Search Query
        ja: 検索クエリ
      description:
        en: The anomaly belongs to this search query. Exactly one DETECTED_ON relation exists per anomaly, matching its subject
          type.
      returnsTypeRef: logos.seo.object.search-query
      cardinality: 0..1
    - accessorId: inverse
      fromTypeRef: logos.seo.object.search-query
      apiName: anomalies
      displayName:
        en: SEO Anomalies
        ja: SEO 異常
      description:
        en: The anomaly belongs to this search query. Exactly one DETECTED_ON relation exists per anomaly, matching its subject
          type.
      returnsTypeRef: logos.seo.object.seo-anomaly
      cardinality: 0..*
  canonicalDirection:
    fromAccessorId: forward
    toAccessorId: inverse
  relationMode: stored
  lifecycle:
    ownership: reference
    onFromDelete: restrict
    onToDelete: restrict
    orphanPolicy: reject
  temporal:
    mode: none
  security:
    classification: internal
  audit:
    enabled: true
    eventCategories:
      - relation_change
    recordBeforeAfter: true
    recordReleaseRefs: true
