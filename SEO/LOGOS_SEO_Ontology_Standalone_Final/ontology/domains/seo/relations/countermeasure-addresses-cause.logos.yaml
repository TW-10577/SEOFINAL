apiVersion: logos.ontology/v0.0.1
kind: RelationType
metadata:
  id: logos.seo.relation.countermeasure-addresses-cause
  apiName: CountermeasureAddressesCause
  displayName:
    en: Countermeasure ADDRESSES Cause Hypothesis
    ja: 対策 ADDRESSES 原因仮説
  description:
    en: The action answers the cause.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §7 R12
spec:
  accessors:
    - accessorId: forward
      fromTypeRef: logos.seo.object.countermeasure
      apiName: cause
      displayName:
        en: Cause Hypothesis
        ja: 原因仮説
      description:
        en: The action answers the cause.
      returnsTypeRef: logos.seo.object.cause-hypothesis
      cardinality: "1"
    - accessorId: inverse
      fromTypeRef: logos.seo.object.cause-hypothesis
      apiName: countermeasures
      displayName:
        en: Countermeasures
        ja: 対策
      description:
        en: The action answers the cause.
      returnsTypeRef: logos.seo.object.countermeasure
      cardinality: 0..*
  canonicalDirection:
    fromAccessorId: forward
    toAccessorId: inverse
  relationMode: stored
  lifecycle:
    ownership: aggregation
    onFromDelete: restrict
    onToDelete: restrict
    orphanPolicy: reject
  temporal:
    mode: none
  security:
    classification: internal
  audit:
    enabled: true
    eventCategories:
      - relation_change
    recordBeforeAfter: true
    recordReleaseRefs: true
