apiVersion: logos.ontology/v0.0.1
kind: RelationType
metadata:
  id: logos.seo.relation.countermeasure-applied-to-search-query
  apiName: CountermeasureAppliedToSearchQuery
  displayName:
    en: Countermeasure APPLIED_TO Search Query
    ja: 対策 APPLIED_TO 検索クエリ
  description:
    en: The search query the action is taken on.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §7 R13 (split per target type)
spec:
  accessors:
    - accessorId: forward
      fromTypeRef: logos.seo.object.countermeasure
      apiName: appliedToSearchQuery
      displayName:
        en: Search Query
        ja: 検索クエリ
      description:
        en: The search query the action is taken on.
      returnsTypeRef: logos.seo.object.search-query
      cardinality: 0..1
    - accessorId: inverse
      fromTypeRef: logos.seo.object.search-query
      apiName: countermeasures
      displayName:
        en: Countermeasures
        ja: 対策
      description:
        en: The search query the action is taken on.
      returnsTypeRef: logos.seo.object.countermeasure
      cardinality: 0..*
  canonicalDirection:
    fromAccessorId: forward
    toAccessorId: inverse
  relationMode: stored
  lifecycle:
    ownership: reference
    onFromDelete: restrict
    onToDelete: restrict
    orphanPolicy: reject
  temporal:
    mode: none
  security:
    classification: internal
  audit:
    enabled: true
    eventCategories:
      - relation_change
    recordBeforeAfter: true
    recordReleaseRefs: true
