apiVersion: logos.ontology/v0.0.1
kind: RelationType
metadata:
  id: logos.seo.relation.query-classified-as
  apiName: QueryClassifiedAs
  displayName:
    en: Search Query CLASSIFIED_AS Query Classification
    ja: 検索クエリ CLASSIFIED_AS クエリ分類
  description:
    en: Brand and category division of the query.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §7 R4
spec:
  accessors:
    - accessorId: forward
      fromTypeRef: logos.seo.object.search-query
      apiName: classifications
      displayName:
        en: Classifications
        ja: 分類
      description:
        en: Brand and category division of the query.
      returnsTypeRef: logos.seo.object.query-classification
      cardinality: 0..*
    - accessorId: inverse
      fromTypeRef: logos.seo.object.query-classification
      apiName: searchQuery
      displayName:
        en: Search Query
        ja: 検索クエリ
      description:
        en: Brand and category division of the query.
      returnsTypeRef: logos.seo.object.search-query
      cardinality: "1"
  canonicalDirection:
    fromAccessorId: forward
    toAccessorId: inverse
  relationMode: stored
  lifecycle:
    ownership: aggregation
    onFromDelete: restrict
    onToDelete: restrict
    orphanPolicy: reject
  temporal:
    mode: none
  security:
    classification: internal
  audit:
    enabled: true
    eventCategories:
      - relation_change
    recordBeforeAfter: true
    recordReleaseRefs: true
