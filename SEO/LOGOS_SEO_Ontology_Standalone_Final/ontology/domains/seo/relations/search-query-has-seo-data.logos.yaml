apiVersion: logos.ontology/v0.0.1
kind: RelationType
metadata:
  id: logos.seo.relation.search-query-has-seo-data
  apiName: SearchQueryHasSEOData
  displayName:
    en: Search Query HAS SEO Data
    ja: 検索クエリ HAS SEO データ
  description:
    en: A query holds its Search Console metric values.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §7 R1
spec:
  accessors:
    - accessorId: forward
      fromTypeRef: logos.seo.object.search-query
      apiName: seoData
      displayName:
        en: SEO Data
        ja: SEO データ
      description:
        en: A query holds its Search Console metric values.
      returnsTypeRef: logos.seo.object.seo-data
      cardinality: 0..*
    - accessorId: inverse
      fromTypeRef: logos.seo.object.seo-data
      apiName: searchQuery
      displayName:
        en: Search Query
        ja: 検索クエリ
      description:
        en: A query holds its Search Console metric values.
      returnsTypeRef: logos.seo.object.search-query
      cardinality: 0..1
  canonicalDirection:
    fromAccessorId: forward
    toAccessorId: inverse
  relationMode: stored
  lifecycle:
    ownership: reference
    onFromDelete: restrict
    onToDelete: restrict
    orphanPolicy: reject
  temporal:
    mode: none
  security:
    classification: internal
  audit:
    enabled: true
    eventCategories:
      - relation_change
    recordBeforeAfter: true
    recordReleaseRefs: true
