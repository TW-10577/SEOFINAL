apiVersion: logos.ontology/v0.0.1
kind: RelationType
metadata:
  id: logos.seo.relation.seo-data-attributed-to-traffic-source
  apiName: SEODataAttributedToTrafficSource
  displayName:
    en: SEO Data ATTRIBUTED_TO Traffic Source
    ja: SEO データ ATTRIBUTED_TO 流入元
  description:
    en: GA4 values belong to an inflow channel.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §7 R5
spec:
  accessors:
    - accessorId: forward
      fromTypeRef: logos.seo.object.seo-data
      apiName: trafficSource
      displayName:
        en: Traffic Source
        ja: 流入元
      description:
        en: GA4 values belong to an inflow channel.
      returnsTypeRef: logos.seo.object.traffic-source
      cardinality: 0..1
    - accessorId: inverse
      fromTypeRef: logos.seo.object.traffic-source
      apiName: seoData
      displayName:
        en: SEO Data
        ja: SEO データ
      description:
        en: GA4 values belong to an inflow channel.
      returnsTypeRef: logos.seo.object.seo-data
      cardinality: 0..*
  canonicalDirection:
    fromAccessorId: forward
    toAccessorId: inverse
  relationMode: stored
  lifecycle:
    ownership: reference
    onFromDelete: restrict
    onToDelete: restrict
    orphanPolicy: reject
  temporal:
    mode: none
  security:
    classification: internal
  audit:
    enabled: true
    eventCategories:
      - relation_change
    recordBeforeAfter: true
    recordReleaseRefs: true
