apiVersion: logos.ontology/v0.0.1
kind: RelationType
metadata:
  id: logos.seo.relation.seo-data-compared-with
  apiName: SEODataComparedWith
  displayName:
    en: SEO Data COMPARED_WITH SEO Data
    ja: SEO データ COMPARED_WITH SEO データ
  description:
    en: Current-period values compared with the previous period of the same unit and metric.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §7 R7
spec:
  accessors:
    - accessorId: forward
      fromTypeRef: logos.seo.object.seo-data
      apiName: previousPeriodData
      displayName:
        en: Previous Period Data
        ja: 前期データ
      description:
        en: Current-period values compared with the previous period of the same unit and metric.
      returnsTypeRef: logos.seo.object.seo-data
      cardinality: 0..1
    - accessorId: inverse
      fromTypeRef: logos.seo.object.seo-data
      apiName: currentPeriodData
      displayName:
        en: Current Period Data
        ja: 今期データ
      description:
        en: Current-period values compared with the previous period of the same unit and metric.
      returnsTypeRef: logos.seo.object.seo-data
      cardinality: 0..1
  canonicalDirection:
    fromAccessorId: forward
    toAccessorId: inverse
  relationMode: stored
  lifecycle:
    ownership: reference
    onFromDelete: restrict
    onToDelete: restrict
    orphanPolicy: reject
  temporal:
    mode: none
  security:
    classification: internal
  audit:
    enabled: true
    eventCategories:
      - relation_change
    recordBeforeAfter: true
    recordReleaseRefs: true
