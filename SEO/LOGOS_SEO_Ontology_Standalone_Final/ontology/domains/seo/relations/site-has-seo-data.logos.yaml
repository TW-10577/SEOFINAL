apiVersion: logos.ontology/v0.0.1
kind: RelationType
metadata:
  id: logos.seo.relation.site-has-seo-data
  apiName: SiteHasSEOData
  displayName:
    en: Site HAS SEO Data
    ja: サイト HAS SEO データ
  description:
    en: "The site holds its site-total GA4 metric values (extension: client rules ① ② judge the site total)."
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
  annotations:
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §7 R1/R2 extension
spec:
  accessors:
    - accessorId: forward
      fromTypeRef: logos.seo.object.site
      apiName: seoData
      displayName:
        en: SEO Data
        ja: SEO データ
      description:
        en: "The site holds its site-total GA4 metric values (extension: client rules ① ② judge the site total)."
      returnsTypeRef: logos.seo.object.seo-data
      cardinality: 0..*
    - accessorId: inverse
      fromTypeRef: logos.seo.object.seo-data
      apiName: site
      displayName:
        en: Site
        ja: サイト
      description:
        en: "The site holds its site-total GA4 metric values (extension: client rules ① ② judge the site total)."
      returnsTypeRef: logos.seo.object.site
      cardinality: 0..1
  canonicalDirection:
    fromAccessorId: forward
    toAccessorId: inverse
  relationMode: stored
  lifecycle:
    ownership: reference
    onFromDelete: restrict
    onToDelete: restrict
    orphanPolicy: reject
  temporal:
    mode: none
  security:
    classification: internal
  audit:
    enabled: true
    eventCategories:
      - relation_change
    recordBeforeAfter: true
    recordReleaseRefs: true
