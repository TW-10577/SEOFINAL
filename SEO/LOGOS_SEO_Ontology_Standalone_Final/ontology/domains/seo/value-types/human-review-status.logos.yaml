apiVersion: logos.ontology/v0.0.1
kind: ValueType
metadata:
  id: logos.seo.value.human-review-status
  apiName: HumanReviewStatus
  displayName:
    en: Human Review Status
    ja: レビュー状況
  description:
    en: SEO team review of a system-generated cause hypothesis (design §8). Never set to Confirmed by the system.
  version: 0.0.1
  owner:
    ownerId: team:logos-seo
    ownerType: team
  visibility: package
spec:
  valueKind: vocabulary
  vocabularyValues:
    - code: NOT_REVIEWED
      apiName: NotReviewed
      displayName:
        en: Not Reviewed
        ja: 未レビュー
      description:
        en: Generated by the system; nobody has reviewed it yet.
      ordinal: 10
    - code: CONFIRMED
      apiName: Confirmed
      displayName:
        en: Confirmed
        ja: 確認済
      description:
        en: The SEO team confirmed the cause.
      ordinal: 20
    - code: REJECTED
      apiName: Rejected
      displayName:
        en: Rejected
        ja: 却下
      description:
        en: The SEO team rejected the cause.
      ordinal: 30
    - code: NEEDS_MORE_EVIDENCE
      apiName: NeedsMoreEvidence
      displayName:
        en: Needs More Evidence
        ja: 追加根拠が必要
      description:
        en: The SEO team needs more evidence before deciding.
      ordinal: 40
