# LOGOS SEO — judgment rules and source mappings.
#
# Every rule below comes from SEO.txt (the client's judgment criteria). Nothing else is evaluated.
# Anything the client has not confirmed is marked `confirmed: false` (mappings) or `unresolved`
# (rule parameters). The measurement engine never guesses an unresolved value: a rule that needs
# one returns NOT_EVALUABLE, or reports that its follow-up branch cannot be determined.
# Unconfirmed mappings are used, but they are shown next to every result that depends on them.

schema_version: 1

# ---------------------------------------------------------------------------------------------
# GA4 — how the Explorations export maps to the terms used in the client rules.
# The export has one column per segment × metric; segment names are the client's own.
# ---------------------------------------------------------------------------------------------
ga4:
  segments:
    total:
      name: 通販（全体）
      confirmed: false
      note: Used as the site total for Sessions and CVR.
    organic:
      name: 通販（全体） オーガニックサーチ
      confirmed: false
      note: Rule ① "organic traffic".
    advertising:
      name: 通販（全体） ペイド系合算
      confirmed: false
      note: Rule ① "advertising traffic". Data Import Method Research §3.3 describes ペイド系合算 as the sum of paid channel groups.
  metrics:
    sessions:
      names: [セッション, Sessions]
      confirmed: true
    cv:
      names: [e コマース購入数, Ecommerce purchases]
      confirmed: false
      note: Rule ② "CV". The export also has トランザクション (transactions) in another report; which one the client means is not confirmed.

# ---------------------------------------------------------------------------------------------
# GSC — supporting evidence for rule ① only (SEO.txt). Never a separate judgment.
# ---------------------------------------------------------------------------------------------
gsc:
  brand_terms:
    # A query containing any of these (case-insensitive) is classified as brand.
    # SEO.txt cites "brand = 66%" but does not give the rule. This list reproduces 65.9% of
    # query clicks on the client export; the client must confirm it.
    terms: [ドスパラ, dospara, どすぱら, ドスバラ, dosupara, ガレリア, galleria, がれりあ, サードウェーブ, thirdwave]
    confirmed: false
  # How many query / page rows to attach as evidence (display setting, not a business rule).
  evidence_rows: 10

# ---------------------------------------------------------------------------------------------
# Rules (SEO.txt). Each rule is a JudgmentCondition (ontology logos.seo.object.judgment-condition);
# threshold_unit, direction and condition_type are checked against its vocabularies at startup.
# Rules (SEO.txt). Texts are the client's wording; *_ja fields are the Japanese UI / report text.
# threshold_unit:
#   percent             relative WoW change rate: (current - previous) / previous × 100
#   percentage_points   absolute WoW difference of a percentage metric (e.g. CVR 0.95% → 0.85% = -0.10)
#   unresolved          client has not confirmed which one → rule returns NOT_EVALUABLE
# ---------------------------------------------------------------------------------------------
rules:
  - id: GA4-R1
    number: ①
    name: Traffic Acquisition — Sessions
    name_ja: 集客 — セッション
    criteria: "Traffic Acquisition — Sessions: ±3.9% or more WoW"
    criteria_ja: 集客 — セッション：前週比 ±3.9% 以上
    primary_judgment: Check the increase/decrease in organic and advertising traffic
    primary_judgment_ja: オーガニック流入と広告流入の増減を確認する
    what_to_check_next: >-
      If organic traffic decreases → Provide feedback to the SEO team.
      If advertising traffic decreases → Provide feedback to the advertising team.
      If both decrease → Report the one with the larger contribution to the decrease as the primary cause.
    what_to_check_next_ja: >-
      オーガニック流入が減少 → SEO チームへフィードバックする。
      広告流入が減少 → 広告チームへフィードバックする。
      両方が減少 → 減少への寄与が大きい方を主因として報告する。
    subject: total
    metric: sessions
    direction: both          # "±" in the client criterion (ontology ChangeDirection)
    condition_type: numeric  # ECM-05 group: numeric / ambiguous (ontology ConditionType)
    threshold_value: 3.9
    threshold_unit: percent
    threshold_note: Sessions is a count, so "±3.9%" can only be a relative change.
    threshold_note_ja: セッションは件数のため、「±3.9%」は相対変化の意味に限られます。

  - id: GA4-R2
    number: ②
    name: Purchase Efficiency — CVR
    name_ja: 購買効率 — CVR
    criteria: "Purchase Efficiency — CVR: ±0.7% or more WoW"
    criteria_ja: 購買効率 — CVR：前週比 ±0.7% 以上
    primary_judgment: Check changes in sessions and CV
    primary_judgment_ja: セッションと CV の変化を確認する
    what_to_check_next: >-
      Sessions increase + CV remains flat/decreases → Check the quality of traffic.
      Sessions remain flat + CVR decreases → Check products, pricing, and pages.
      CVR and sessions both increase → Identify the factors contributing to the improvement.
    what_to_check_next_ja: >-
      セッション増加 + CV 横ばい/減少 → 流入の質を確認する。
      セッション横ばい + CVR 減少 → 商品・価格・ページを確認する。
      CVR とセッションがともに増加 → 改善に寄与した要因を特定する。
    subject: total
    metric: cvr
    direction: both
    condition_type: numeric
    threshold_value: 0.7
    threshold_unit: unresolved
    threshold_note: >-
      CVR is itself a percentage, so "±0.7%" can mean a relative change (0.95% → 0.94%)
      or 0.7 percentage points (0.95% → 0.25%). Set percent or percentage_points once confirmed.
    threshold_note_ja: >-
      CVR 自体が割合のため、「±0.7%」は相対変化（0.95% → 0.94%）と
      0.7 ポイント（0.95% → 0.25%）のどちらにも読めます。確認後に percent か percentage_points を設定してください。
    # Band (relative %, ±) within which Sessions / CV count as "flat" for the follow-up branches.
    # The client has not defined "flat"; null = unresolved → branch cannot be determined.
    flat_band_percent: null

# Actions named in "What to Check Next", used as countermeasure suggestions.
actions:
  GA4-R1:
    organic:
      action: Provide feedback to the SEO team.
      action_ja: SEO チームへフィードバックする。
      team: SEO team
      team_ja: SEO チーム
    advertising:
      action: Provide feedback to the advertising team.
      action_ja: 広告チームへフィードバックする。
      team: Advertising team
      team_ja: 広告チーム
  GA4-R2:
    traffic_quality:
      condition: Sessions increase + CV remains flat/decreases
      condition_ja: セッション増加 + CV 横ばい/減少
      action: Check the quality of traffic.
      action_ja: 流入の質を確認する。
    product_price_page:
      condition: Sessions remain flat + CVR decreases
      condition_ja: セッション横ばい + CVR 減少
      action: Check products, pricing, and pages.
      action_ja: 商品・価格・ページを確認する。
    improvement:
      condition: CVR and sessions both increase
      condition_ja: CVR とセッションがともに増加
      action: Identify the factors contributing to the improvement.
      action_ja: 改善に寄与した要因を特定する。
