    kind: points
    value: 0.7
    confirmed: false
    source: "SEO.txt ② 購入効率: CVR前週比 ±0.7% (read as percentage points; confirm with SEO team)"
  clicks:
    kind: relative
    value: 10
    confirmed: false
    source: "Placeholder: no GSC threshold agreed yet"
  impressions:
    kind: relative
    value: 10
    confirmed: false
    source: "Placeholder: no GSC threshold agreed yet"
  ctr:
    kind: points
    value: 0.5
    confirmed: false
    source: "Placeholder: no GSC threshold agreed yet"
  position:
    kind: rank
    value: 0.5
    confirmed: false
    source: "Placeholder: no GSC threshold agreed yet"
