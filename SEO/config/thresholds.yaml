# Week-over-week thresholds used by SEO/seo-api. Each entry must be a valid logos.seo.value.threshold.
#   kind: relative = % change, points = percentage-point change, rank = change in average position
#   confirmed: true only once the SEO team has agreed the value.
# Restart seo-api after editing.
thresholds:
  sessions:
    kind: relative
    value: 3.9
    confirmed: true
    source: "SEO.txt ① 集客状況: セッション前週比 ±3.9%"
