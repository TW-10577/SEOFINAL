# Loaded at startup by SEO/seo-api. apiName values must match the fields the API stores (checked on startup).
apiVersion: logos.ontology/v0.0.1
kind: ObjectType
metadata:
  id: logos.seo.object.countermeasure
  apiName: Countermeasure
  displayName:
    en: Countermeasure
    ja: 対策
  description:
    en: An action proposed for an SEO anomaly; never executed automatically.
    ja: SEO異常に対して提案されるアクション。自動実行はしない。
  version: 0.0.1
  owner:
    ownerId: team:logos-platform
    ownerType: team
  visibility: package
  annotations:
    logos.ext/source-namespace: logos.seo
    logos.ext/consumed-by: SEO/seo-api (src/ontology.ts)
    logos.ext/source-object-id: SEO-O3
spec:
  semanticKind: business_concept
  identity:
    strategy: system_generated
    primaryPropertyRef: '#property/countermeasure-id'
  properties:
  - memberId: countermeasure-id
    apiName: countermeasureId
    displayName:
      en: Countermeasure ID
      ja: 対策ID
    description:
      en: Unique identifier of the countermeasure.
      ja: 対策の一意識別子。
    valueTypeRef: logos.retail-ec-common.value.subject-id
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
    immutable: true
    sourceAuthority:
      authorityKind: internal
      riskLevel: low
  - memberId: related-anomaly-id
    apiName: relatedAnomalyId
    displayName:
      en: Related Anomaly ID
      ja: 関連異常ID
    description:
      en: Anomaly this countermeasure addresses (see relation AnomalyHasCountermeasure).
      ja: この対策が対応する異常（AnomalyHasCountermeasure参照）。
    valueTypeRef: logos.retail-ec-common.value.subject-id
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
    immutable: true
    sourceAuthority:
      authorityKind: internal
      riskLevel: low
  - memberId: description
    apiName: description
    displayName:
      en: Description
      ja: 内容
    description:
      en: Suggested action.
      ja: 推奨アクション。
    valueTypeRef: logos.shared-core.value.long-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
    sourceAuthority:
      authorityKind: internal
      riskLevel: low
  - memberId: reason
    apiName: reason
    displayName:
      en: Reason
      ja: 理由
    description:
      en: Why the action is suggested.
      ja: このアクションを推奨する理由。
    valueTypeRef: logos.shared-core.value.long-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
    sourceAuthority:
      authorityKind: internal
      riskLevel: low
  - memberId: owner-team
    apiName: ownerTeam
    displayName:
      en: Owner Team
      ja: 担当チーム
    description:
      en: Team that should act on it.
      ja: 対応するチーム。
    valueTypeRef: logos.shared-core.value.short-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
    sourceAuthority:
      authorityKind: internal
      riskLevel: low
  - memberId: priority
    apiName: priority
    displayName:
      en: Priority
      ja: 優先度
    description:
      en: Priority of the action.
      ja: アクションの優先度。
    valueTypeRef: logos.seo.value.priority-level
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
    sourceAuthority:
      authorityKind: internal
      riskLevel: low
  - memberId: status
    apiName: status
    displayName:
      en: Status
      ja: ステータス
    description:
      en: Decision status set by the SEO team.
      ja: SEO担当が設定する判断ステータス。
    valueTypeRef: logos.seo.value.countermeasure-status
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
    sourceAuthority:
      authorityKind: internal
      riskLevel: low
  - memberId: created-date
    apiName: createdDate
    displayName:
      en: Created Date
      ja: 作成日
    description:
      en: Date the countermeasure was proposed.
      ja: 対策が提案された日。
    valueTypeRef: logos.shared-core.value.date
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
    sourceAuthority:
      authorityKind: internal
      riskLevel: low
  - memberId: rule
    apiName: rule
    displayName:
      en: Rule
      ja: 判断ルール
    description:
      en: Business rule that produced the suggestion.
      ja: 提案を生成した判断ルール。
    valueTypeRef: logos.shared-core.value.short-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
    sourceAuthority:
      authorityKind: internal
      riskLevel: low
  - memberId: rule-confirmed
    apiName: ruleConfirmed
    displayName:
      en: Rule Confirmed
      ja: ルール確認済み
    description:
      en: True when the rule comes from the SEO team; false for system heuristics.
      ja: SEO担当が定めたルールならtrue、システムの仮ルールならfalse。
    valueTypeRef: logos.shared-core.value.boolean
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
    sourceAuthority:
      authorityKind: internal
      riskLevel: low
  security:
    classification: internal
    policyCombining: deny_overrides
    readPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    queryPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
    - property_change
    recordReleaseRefs: true
    integrityMode: hash_chain
    retentionPolicyRef: logos.shared-core.policy.audit-retention-7y
  titlePropertyRef: '#property/description'
