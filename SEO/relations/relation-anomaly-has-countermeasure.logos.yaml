apiVersion: logos.ontology/v0.0.1
kind: RelationType
metadata:
  id: logos.seo.relation.anomaly-has-countermeasure
  apiName: AnomalyHasCountermeasure
  displayName:
    en: Anomaly Has Countermeasure
    ja: 異常は対策を持つ
  description:
    en: Links an SEO Anomaly to its suggested or implemented countermeasures.
    ja: SEO異常をその提案または実装された対策に関連付ける。
  version: 0.0.1
  owner:
    ownerId: team:logos-platform
    ownerType: team
  visibility: package
  annotations:
    logos.ext/source-ontology-version: v0.3
    logos.ext/source-namespace: logos.seo
    logos.ext/source-relation-id: SEO-R5

spec:
  accessors:
  - accessorId: from
    fromTypeRef: logos.seo.object.seo-anomaly
    apiName: countermeasures
    displayName:
      en: Countermeasures
      ja: 対策
    description:
      en: The suggested countermeasures for this anomaly.
      ja: この異常に対する提案された対策。
    returnsTypeRef: logos.seo.object.countermeasure
    cardinality: 0..*

  - accessorId: to
    fromTypeRef: logos.seo.object.countermeasure
    apiName: relatedAnomalies
    displayName:
      en: Related Anomalies
      ja: 関連する異常
    description:
      en: The anomalies that this countermeasure addresses.
      ja: この対策が対処する異常。
    returnsTypeRef: logos.seo.object.seo-anomaly
    cardinality: 0..*

  canonicalDirection:
    fromAccessorId: from
    toAccessorId: to

  relationMode: stored

  security:
    classification: internal
    policyCombining: deny_overrides
    readPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    queryPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false

  audit:
    enabled: true
    eventCategories:
    - relation_change
    recordReleaseRefs: true
    integrityMode: hash_chain
    retentionPolicyRef: logos.shared-core.policy.audit-retention-7y
