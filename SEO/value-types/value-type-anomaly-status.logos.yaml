apiVersion: logos.ontology/v0.0.1
kind: ValueType
metadata:
  id: logos.seo.value.anomaly-status
  apiName: AnomalyStatus
  displayName:
    en: Anomaly Status
    ja: 異常ステータス
  description:
    en: Status of an SEO anomaly in the investigation and resolution workflow.
    ja: 調査と解決ワークフロー内のSEO異常のステータス。
  version: 0.0.1
  owner:
    ownerId: team:logos-platform
    ownerType: team
  visibility: package
  annotations:
    logos.ext/source-ontology-version: v0.3
    logos.ext/source-namespace: logos.seo

spec:
  valueKind: enumerated_text
  textConstraint:
    caseSensitive: true
    minLength: 1
    maxLength: 50
  enumeratedValues:
  - value: Detected
    displayName:
      en: Detected
      ja: 検出
    description:
      en: Anomaly has been detected by the system.
      ja: システムが異常を検出しました。
  - value: UnderReview
    displayName:
      en: Under Review
      ja: 確認中
    description:
      en: SEO team is currently reviewing the anomaly.
      ja: SEOチームが異常を確認中です。
  - value: Confirmed
    displayName:
      en: Confirmed
      ja: 確認済
    description:
      en: SEO team has confirmed the anomaly and cause.
      ja: SEOチームが異常と原因を確認しました。
  - value: Resolved
    displayName:
      en: Resolved
      ja: 解決
    description:
      en: The anomaly issue has been resolved.
      ja: 異常の問題は解決されました。
