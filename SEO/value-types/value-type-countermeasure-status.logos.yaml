apiVersion: logos.ontology/v0.0.1
kind: ValueType
metadata:
  id: logos.seo.value.countermeasure-status
  apiName: CountermeasureStatus
  displayName:
    en: Countermeasure Status
    ja: 対策ステータス
  description:
    en: Status of a countermeasure implementation workflow.
    ja: 対策実装ワークフローのステータス。
  version: 0.0.1
  owner:
    ownerId: team:logos-platform
    ownerType: team
  visibility: package
  annotations:
    logos.ext/source-ontology-version: v0.3
    logos.ext/source-namespace: logos.seo

spec:
  valueKind: enumerated_text
  textConstraint:
    caseSensitive: true
    minLength: 1
    maxLength: 50
  enumeratedValues:
  - value: Proposed
    displayName:
      en: Proposed
      ja: 提案
    description:
      en: Countermeasure has been proposed by the system.
      ja: システムが対策を提案しました。
  - value: Approved
    displayName:
      en: Approved
      ja: 承認
    description:
      en: SEO team has approved the countermeasure.
      ja: SEOチームが対策を承認しました。
  - value: Implemented
    displayName:
      en: Implemented
      ja: 実装
    description:
      en: The countermeasure has been implemented.
      ja: 対策が実装されました。
  - value: Verified
    displayName:
      en: Verified
      ja: 検証
    description:
      en: The effectiveness of the countermeasure has been verified.
      ja: 対策の有効性が検証されました。
  - value: Rejected
    displayName:
      en: Rejected
      ja: 却下
    description:
      en: SEO team rejected the countermeasure.
      ja: SEOチームが対策を却下しました。
