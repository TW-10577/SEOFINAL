# Judgment conditions (LOGOS_SEO_Ontology_Design §6 O7). Each entry must be a valid logos.seo.object.judgment-condition.
#   unit:      relative = % change, points = percentage-point change, rank = change in average position
#   direction: both | increase | decrease
#   confirmed: true only once the SEO team has agreed the condition, including its unit
# Restart seo-api after editing.
conditions:
  - conditionId: JC-SESSIONS
    name: ① 集客状況 — sessions week on week
    metricKey: sessions
    direction: both
    threshold: 3.9
    unit: relative
    conditionType: numeric
    confirmed: true
    source: "SEO.txt ①: セッション前週比 ±3.9%以上 (sessions are a count, so only a relative change is meaningful)"

  - conditionId: JC-CVR
    name: ② 購入効率 — CVR week on week
    metricKey: cvr
    direction: both
    threshold: 0.7
    unit: points
    conditionType: numeric
    confirmed: false
    source: "SEO.txt ②: CVR前週比 ±0.7%以上. UNIT OPEN: 0.7 pt never fires at CVR ≈0.96%, 0.7% relative fires ~84% of weeks"

  - conditionId: JC-GSC-CLICKS
    name: GSC clicks week on week
    metricKey: clicks
    direction: both
    threshold: 10
    unit: relative
    conditionType: numeric
    confirmed: false
    source: "Placeholder: no GSC condition agreed yet"

  - conditionId: JC-GSC-IMPRESSIONS
    name: GSC impressions week on week
    metricKey: impressions
    direction: both
    threshold: 10
    unit: relative
    conditionType: numeric
    confirmed: false
    source: "Placeholder: no GSC condition agreed yet"

  - conditionId: JC-GSC-CTR
    name: GSC CTR week on week
    metricKey: ctr
    direction: both
    threshold: 0.5
    unit: points
    conditionType: numeric
    confirmed: false
    source: "Placeholder: no GSC condition agreed yet"

  - conditionId: JC-GSC-POSITION
    name: GSC average position week on week
    metricKey: position
    direction: both
    threshold: 0.5
    unit: rank
    conditionType: numeric
    confirmed: false
    source: "Placeholder: no GSC condition agreed yet"

# Bands that decide when a metric counts as 横ばい (flat) in rule ②. Not defined in SEO.txt: OPEN QUESTION.
flatBands:
  sessions:
    value: 3.9
    unit: relative
    confirmed: false
    source: "Assumed equal to the sessions condition; SEO.txt does not define 横ばい"
  purchases:
    value: 3.9
    unit: relative
    confirmed: false
    source: "Assumed equal to the sessions condition; SEO.txt does not define 横ばい"
