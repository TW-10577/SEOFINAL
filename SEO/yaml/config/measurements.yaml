# Measurements and the data sources behind them, as agreed in the SEO measurement sheet.
# Each measurement points at a judgment condition in judgment-conditions.yaml (threshold and unit live there).
# Each data source lists the upload kinds (logos.seo.value.data-source) that count as that source.
# Restart seo-api after editing.
measurements:
  - measurementId: M1
    number: ①
    name: Sessions ±3.9% WoW
    conditionId: JC-SESSIONS
    primarySource: GA4
    branches:
      - when: Organic ↓
        then: SEO team
      - when: Ads ↓
        then: Ads team
      - when: Both ↓
        then: Report the larger driver
    supportedBy: GSC daily chart, queries and pages explain an organic drop

  - measurementId: M2
    number: ②
    name: CVR ±0.7% WoW
    conditionId: JC-CVR
    primarySource: GA4
    branches:
      - when: Sessions ↑, CV flat/↓
        then: Traffic quality
      - when: Sessions flat, CVR ↓
        then: Products / price / pages
      - when: Both ↑
        then: Find the drivers
    supportedBy: GA4 only (GSC has no sessions or CV)

dataSources:
  - no: 1
    files: download 29.csv, download 43.csv
    source: GA4 Explorations (free-form) export
    sourceKinds: [ga4-daily, ga4-snapshot]
    memo1: 5 comment lines (# ----), 2-row header (segment + metric), a totals row tagged 総計 in a trailing column, UTF-8 with BOM, wide layout (one column per segment × metric)
    memo2: UI exports are not machine-friendly; PoC should use the API and a long (tidy) format instead
    import: ok
    sampleDateRange: 2026/09/10 - 2026/09/15, 2026/09/12 - 2026/09/13
    dummyDateRange: 2026/09/16 - 2026/09/23
    measurement1: "① Sessions ±3.9% WoW: Organic ↓ → SEO team; Ads ↓ → Ads team; Both ↓ → report larger driver"
    measurement2: "② CVR ±0.7% WoW: Sessions ↑, CV flat/↓ → traffic quality; Sessions flat, CVR ↓ → products/price/pages; Both ↑ → find drivers"

  - no: 2
    files: 1790323527467_クエリ.csv
    source: GSC Performance → Queries
    sourceKinds: [gsc-queries]
    memo1: Exactly 1,000 rows = UI export cap. These rows sum to 1,513,981 clicks of 3,409,251 total (~44%)
    memo2: UI export loses ~56% of query clicks (long tail + anonymized). Use API / Bulk Export
    import: ok
    sampleDateRange: 2026/06/16 - 2026/09/15 (3-month total, no date column)
    dummyDateRange: "-"
    measurement1: "① supports: when organic ↓, Clicks, Impressions, CTR, Position per keyword show which keywords bring traffic (brand = 66%). 3-month total, no WoW"
    measurement2: "② not used: no sessions / CV in GSC"

  - no: 3
    files: 1790323527469_ページ.csv
    source: GSC → Pages
    sourceKinds: [gsc-pages]
    memo1: 1,000 rows, 3,209,424 clicks (~94% of total)
    memo2: Page level is mostly covered, but still capped
    import: ok
    sampleDateRange: 2026/06/16 - 2026/09/15 (3-month total, no date column)
    dummyDateRange: "-"
    measurement1: "① supports: when organic ↓, Clicks, Impressions, CTR, Position per page show which pages bring traffic (top page 19.6%, /gamepc 7.1%). 3-month total, no WoW"
    measurement2: "② not used: no sessions / CV in GSC"

  - no: 4
    files: …_デバイス.csv, …_国.csv, …_検索での見え方.csv, …_平均読み込み時間のチャート.csv
    source: GSC → other tabs
    sourceKinds: [gsc-daily, gsc-other]
    memo1: Each dimension exported separately; daily chart = 92 days (2026-06-16 → 09-15); フィルタ.csv holds filter metadata (web, last 3 months)
    memo2: Each export is a separate 1-D cut; the API returns them combined in one row set. Filter metadata must travel with the file (manifest)
    import: ok
    sampleDateRange: 2026/06/16 - 2026/09/15
    dummyDateRange: "-"
    measurement1: "① supports: when organic ↓, the daily chart (13 real weeks) shows the reason: Position worse = ranking dropped, Impressions ↓ = fewer searches, CTR ↓ = title/snippet problem"
    measurement2: "② not used: no sessions / CV in GSC"
