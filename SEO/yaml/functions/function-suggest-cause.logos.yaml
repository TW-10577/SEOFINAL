# Loaded at startup by SEO/seo-api; checked against the API code.
apiVersion: logos.ontology/v0.0.1
kind: Function
metadata:
  id: logos.seo.function.suggest-cause
  apiName: SuggestCause
  displayName:
    en: Suggest Cause
    ja: 原因を提案
  description:
    en: Rule-based cause hypothesis and countermeasure for an anomaly (SEO.txt rules ① ②, unconfirmed GSC heuristics).
    ja: 判断ルール（SEO.txt ①②、未確認のGSC仮ルール）で原因仮説と対策を提案する。
  version: 0.0.1
  owner:
    ownerId: team:logos-platform
    ownerType: team
  visibility: package
  annotations:
    logos.ext/source-namespace: logos.seo
    logos.ext/consumed-by: SEO/seo-api (src/ontology.ts)
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §5.1
    logos.ext/locale-status: Japanese labels are a draft; business terms to be confirmed by the SEO team
    logos.ext/implementation: seo-api/src/rules.ts suggest
spec:
  input:
    parameters:
    - parameterId: anomaly
      apiName: anomaly
      displayName:
        en: Anomaly
        ja: 異常
      valueTypeRef: logos.seo.object.seo-anomaly
      required: true
  output:
    parameters:
    - parameterId: cause
      apiName: cause
      displayName:
        en: Cause Hypothesis
        ja: 原因仮説
      valueTypeRef: logos.seo.object.cause-hypothesis
      required: true
    - parameterId: countermeasure
      apiName: countermeasure
      displayName:
        en: Countermeasure
        ja: 対策
      valueTypeRef: logos.seo.object.countermeasure
      required: true
  functionMode: deterministic
  requiresApproval: true
