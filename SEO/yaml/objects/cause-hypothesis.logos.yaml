# Loaded at startup by SEO/seo-api; checked against the API code.
apiVersion: logos.ontology/v0.0.1
kind: ObjectType
metadata:
  id: logos.seo.object.cause-hypothesis
  apiName: CauseHypothesis
  displayName:
    en: Cause Hypothesis
    ja: 原因仮説
  description:
    en: A possible explanation for an anomaly. Today it comes from fixed rules, not AI.
    ja: 異常に対する想定原因。現在はAIではなく固定ルールで生成。
  version: 0.0.1
  owner:
    ownerId: team:logos-platform
    ownerType: team
  visibility: package
  annotations:
    logos.ext/source-namespace: logos.seo
    logos.ext/consumed-by: SEO/seo-api (src/ontology.ts)
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §6 O9
    logos.ext/locale-status: Japanese labels are a draft; business terms to be confirmed by the SEO team
spec:
  semanticKind: business_concept
  identity:
    strategy: system_generated
    primaryPropertyRef: '#property/cause-id'
  properties:
  - memberId: cause-id
    apiName: causeId
    displayName:
      en: Cause ID
      ja: 原因ID
    description:
      en: Unique identifier.
    valueTypeRef: logos.retail-ec-common.value.record-id
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: anomaly-id
    apiName: anomalyId
    displayName:
      en: Anomaly
      ja: 異常
    description:
      en: Anomaly this explains (R11 EXPLAINS).
    valueTypeRef: logos.retail-ec-common.value.record-id
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: hypothesis
    apiName: hypothesis
    displayName:
      en: Hypothesis
      ja: 仮説
    description:
      en: Suggested explanation.
    valueTypeRef: logos.shared-core.value.long-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: supporting-evidence
    apiName: supportingEvidence
    displayName:
      en: Supporting Evidence
      ja: 根拠
    description:
      en: Values that support the hypothesis.
    valueTypeRef: logos.shared-core.value.long-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: confidence
    apiName: confidence
    displayName:
      en: Confidence
      ja: 確信度
    description:
      en: Scale still to be confirmed (§9); not set by the rules.
    valueTypeRef: logos.shared-core.value.short-text
    required: false
    nullable: true
    valueMode: stored
    sensitivity: internal
  - memberId: review-status
    apiName: reviewStatus
    displayName:
      en: Review Status
      ja: 確認ステータス
    description:
      en: Set by the SEO team (§8).
    valueTypeRef: logos.seo.value.review-status
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: rule
    apiName: rule
    displayName:
      en: Rule
      ja: 判断ルール
    description:
      en: Rule that produced the hypothesis.
    valueTypeRef: logos.shared-core.value.short-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: rule-confirmed
    apiName: ruleConfirmed
    displayName:
      en: Rule Confirmed
      ja: ルール確認済み
    description:
      en: True when the rule comes from the SEO team.
    valueTypeRef: logos.shared-core.value.boolean
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: created-date
    apiName: createdDate
    displayName:
      en: Created Date
      ja: 作成日
    description:
      en: Date created.
    valueTypeRef: logos.shared-core.value.date
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  security:
    classification: internal
    policyCombining: deny_overrides
    readPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    queryPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
    - property_change
    recordReleaseRefs: true
    integrityMode: hash_chain
    retentionPolicyRef: logos.shared-core.policy.audit-retention-7y
  titlePropertyRef: '#property/hypothesis'
