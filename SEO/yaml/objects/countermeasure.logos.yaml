# Loaded at startup by SEO/seo-api; checked against the API code.
apiVersion: logos.ontology/v0.0.1
kind: ObjectType
metadata:
  id: logos.seo.object.countermeasure
  apiName: Countermeasure
  displayName:
    en: Countermeasure
    ja: 対策
  description:
    en: A suggested SEO or advertising action answering a cause. Never executed by the system.
    ja: 原因に対するSEO・広告の推奨アクション。システムは実行しない。
  version: 0.0.1
  owner:
    ownerId: team:logos-platform
    ownerType: team
  visibility: package
  annotations:
    logos.ext/source-namespace: logos.seo
    logos.ext/consumed-by: SEO/seo-api (src/ontology.ts)
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §6 O10
    logos.ext/locale-status: Japanese labels are a draft; business terms to be confirmed by the SEO team
spec:
  semanticKind: business_concept
  identity:
    strategy: system_generated
    primaryPropertyRef: '#property/countermeasure-id'
  properties:
  - memberId: countermeasure-id
    apiName: countermeasureId
    displayName:
      en: Countermeasure ID
      ja: 対策ID
    description:
      en: Unique identifier.
    valueTypeRef: logos.retail-ec-common.value.record-id
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: cause-id
    apiName: causeId
    displayName:
      en: Cause
      ja: 原因
    description:
      en: Cause hypothesis this addresses (R12 ADDRESSES).
    valueTypeRef: logos.retail-ec-common.value.record-id
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: description
    apiName: description
    displayName:
      en: Countermeasure
      ja: 対策内容
    description:
      en: Suggested action.
    valueTypeRef: logos.shared-core.value.long-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: reason
    apiName: reason
    displayName:
      en: Reason
      ja: 理由
    description:
      en: Why it is suggested.
    valueTypeRef: logos.shared-core.value.long-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: target
    apiName: target
    displayName:
      en: Target
      ja: 対象
    description:
      en: Query, page or analysis unit the action applies to (R13).
    valueTypeRef: logos.shared-core.value.short-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: owner-team
    apiName: ownerTeam
    displayName:
      en: Owner Team
      ja: 担当チーム
    description:
      en: Team expected to act.
    valueTypeRef: logos.shared-core.value.short-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: priority
    apiName: priority
    displayName:
      en: Priority
      ja: 優先度
    description:
      en: High, Medium or Low.
    valueTypeRef: logos.seo.value.priority-level
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: status
    apiName: status
    displayName:
      en: Status
      ja: ステータス
    description:
      en: Governed lifecycle (§8).
    valueTypeRef: logos.seo.value.countermeasure-status
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: created-date
    apiName: createdDate
    displayName:
      en: Created Date
      ja: 作成日
    description:
      en: Date proposed.
    valueTypeRef: logos.shared-core.value.date
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: decided-by
    apiName: decidedBy
    displayName:
      en: Decided By
      ja: 決定者
    description:
      en: 'Person who decided. Not recorded yet: there is no login.'
    valueTypeRef: logos.shared-core.value.short-text
    required: false
    nullable: true
    valueMode: stored
    sensitivity: internal
  security:
    classification: internal
    policyCombining: deny_overrides
    readPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    queryPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
    - property_change
    recordReleaseRefs: true
    integrityMode: hash_chain
    retentionPolicyRef: logos.shared-core.policy.audit-retention-7y
  titlePropertyRef: '#property/description'
