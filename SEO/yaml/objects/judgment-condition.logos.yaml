# Loaded at startup by SEO/seo-api; checked against the API code.
apiVersion: logos.ontology/v0.0.1
kind: ObjectType
metadata:
  id: logos.seo.object.judgment-condition
  apiName: JudgmentCondition
  displayName:
    en: Judgment Condition
    ja: 判断条件
  description:
    en: The business rule that decides whether a change is significant. Instances live in config/judgment-conditions.yaml.
    ja: 変化が重要かどうかを判定する業務ルール。実体は config/judgment-conditions.yaml。
  version: 0.0.1
  owner:
    ownerId: team:logos-platform
    ownerType: team
  visibility: package
  annotations:
    logos.ext/source-namespace: logos.seo
    logos.ext/consumed-by: SEO/seo-api (src/ontology.ts)
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §6 O7
    logos.ext/locale-status: Japanese labels are a draft; business terms to be confirmed by the SEO team
spec:
  semanticKind: business_concept
  identity:
    strategy: system_generated
    primaryPropertyRef: '#property/condition-id'
  properties:
  - memberId: condition-id
    apiName: conditionId
    displayName:
      en: Condition ID
      ja: 条件ID
    description:
      en: Stable identifier.
    valueTypeRef: logos.retail-ec-common.value.record-id
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: name
    apiName: name
    displayName:
      en: Condition Name
      ja: 条件名
    description:
      en: Business name of the condition.
    valueTypeRef: logos.shared-core.value.short-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: metric-key
    apiName: metricKey
    displayName:
      en: Metric
      ja: 指標
    description:
      en: Metric the condition watches (sessions, cvr, clicks, ...).
    valueTypeRef: logos.shared-core.value.short-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: direction
    apiName: direction
    displayName:
      en: Direction
      ja: 方向
    description:
      en: Direction of change that counts.
    valueTypeRef: logos.seo.value.direction
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: threshold
    apiName: threshold
    displayName:
      en: Threshold Value
      ja: 閾値
    description:
      en: Size of change that counts, in the unit below.
    valueTypeRef: logos.shared-core.value.number
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: unit
    apiName: unit
    displayName:
      en: Unit
      ja: 単位
    description:
      en: relative = %, points = percentage points, rank = positions.
    valueTypeRef: logos.seo.value.change-kind
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: condition-type
    apiName: conditionType
    displayName:
      en: Condition Type
      ja: 条件タイプ
    description:
      en: numeric or ambiguous.
    valueTypeRef: logos.seo.value.condition-type
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: confirmed
    apiName: confirmed
    displayName:
      en: Confirmed
      ja: 確認済み
    description:
      en: True once the SEO team has agreed the condition.
    valueTypeRef: logos.shared-core.value.boolean
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: source
    apiName: source
    displayName:
      en: Source
      ja: 出典
    description:
      en: Where the condition comes from.
    valueTypeRef: logos.shared-core.value.long-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  security:
    classification: internal
    policyCombining: deny_overrides
    readPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    queryPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
    - property_change
    recordReleaseRefs: true
    integrityMode: hash_chain
    retentionPolicyRef: logos.shared-core.policy.audit-retention-7y
  titlePropertyRef: '#property/name'
