# Loaded at startup by SEO/seo-api; checked against the API code.
apiVersion: logos.ontology/v0.0.1
kind: ObjectType
metadata:
  id: logos.seo.object.seo-anomaly
  apiName: SEOAnomaly
  displayName:
    en: SEO Anomaly
    ja: SEO異常
  description:
    en: A significant change detected on one analysis unit and one metric.
    ja: 1つの分析単位・1つの指標で検出された重要な変化。
  version: 0.0.1
  owner:
    ownerId: team:logos-platform
    ownerType: team
  visibility: package
  annotations:
    logos.ext/source-namespace: logos.seo
    logos.ext/consumed-by: SEO/seo-api (src/ontology.ts)
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §6 O8
    logos.ext/locale-status: Japanese labels are a draft; business terms to be confirmed by the SEO team
spec:
  semanticKind: business_concept
  identity:
    strategy: system_generated
    primaryPropertyRef: '#property/anomaly-id'
  properties:
  - memberId: anomaly-id
    apiName: anomalyId
    displayName:
      en: Anomaly ID
      ja: 異常ID
    description:
      en: Unique identifier.
    valueTypeRef: logos.retail-ec-common.value.record-id
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: dataset-id
    apiName: datasetId
    displayName:
      en: Dataset ID
      ja: データセットID
    description:
      en: Uploaded dataset the values come from (R9 BASED_ON).
    valueTypeRef: logos.retail-ec-common.value.record-id
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: source
    apiName: source
    displayName:
      en: Data Source
      ja: データソース
    description:
      en: Kind of export.
    valueTypeRef: logos.seo.value.data-source
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: metric-key
    apiName: metricKey
    displayName:
      en: Metric Key
      ja: 指標キー
    description:
      en: Stable metric key.
    valueTypeRef: logos.shared-core.value.short-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: metric-name
    apiName: metricName
    displayName:
      en: Metric
      ja: 指標
    description:
      en: Metric display name.
    valueTypeRef: logos.shared-core.value.short-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: scope
    apiName: scope
    displayName:
      en: Subject
      ja: 対象
    description:
      en: 'Analysis unit the anomaly belongs to (R8): today the whole site (GSC) or a GA4 segment.'
    valueTypeRef: logos.shared-core.value.short-text
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: kind
    apiName: kind
    displayName:
      en: Change Kind
      ja: 変化の種類
    description:
      en: How the change is measured.
    valueTypeRef: logos.seo.value.change-kind
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: previous-value
    apiName: previousValue
    displayName:
      en: Previous Value
      ja: 前週値
    description:
      en: Previous period value.
    valueTypeRef: logos.shared-core.value.number
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: current-value
    apiName: currentValue
    displayName:
      en: Current Value
      ja: 今週値
    description:
      en: Current period value.
    valueTypeRef: logos.shared-core.value.number
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: absolute-change
    apiName: absoluteChange
    displayName:
      en: Change
      ja: 変化量
    description:
      en: Current minus previous.
    valueTypeRef: logos.shared-core.value.number
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: change-percentage
    apiName: changePercentage
    displayName:
      en: Change Rate
      ja: 変化率
    description:
      en: Relative change; null when previous is 0.
    valueTypeRef: logos.seo.value.signed-percentage
    required: true
    nullable: true
    valueMode: stored
    sensitivity: internal
  - memberId: judgment-condition-id
    apiName: judgmentConditionId
    displayName:
      en: Condition Applied
      ja: 適用条件
    description:
      en: Judgment condition that made the change significant (R10 EVALUATED_BY).
    valueTypeRef: logos.retail-ec-common.value.record-id
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: threshold
    apiName: threshold
    displayName:
      en: Threshold Applied
      ja: 適用閾値
    description:
      en: Copy of the threshold in force at detection time.
    valueTypeRef: logos.seo.value.threshold
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: previous-period
    apiName: previousPeriod
    displayName:
      en: Previous Period
      ja: 前週期間
    description:
      en: Previous analysis period.
    valueTypeRef: logos.seo.value.period
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: current-period
    apiName: currentPeriod
    displayName:
      en: Current Period
      ja: 今週期間
    description:
      en: Current analysis period.
    valueTypeRef: logos.seo.value.period
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: detection-date
    apiName: detectionDate
    displayName:
      en: Detection Date
      ja: 検出日
    description:
      en: Date of detection.
    valueTypeRef: logos.shared-core.value.date
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  - memberId: status
    apiName: status
    displayName:
      en: Status
      ja: ステータス
    description:
      en: Governed lifecycle (§8).
    valueTypeRef: logos.seo.value.anomaly-status
    required: true
    nullable: false
    valueMode: stored
    sensitivity: internal
  security:
    classification: internal
    policyCombining: deny_overrides
    readPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    queryPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
    - property_change
    recordReleaseRefs: true
    integrityMode: hash_chain
    retentionPolicyRef: logos.shared-core.policy.audit-retention-7y
  titlePropertyRef: '#property/metric-name'
