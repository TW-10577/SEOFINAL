# Loaded at startup by SEO/seo-api; checked against the API code.
apiVersion: logos.ontology/v0.0.1
kind: RelationType
metadata:
  id: logos.seo.relation.anomaly-evaluated-by
  apiName: AnomalyEvaluatedBy
  displayName:
    en: Anomaly evaluated by judgment condition
    ja: 異常の判定条件
  description:
    en: Anomaly evaluated by judgment condition (R10).
    ja: 異常の判定条件（R10）。
  version: 0.0.1
  owner:
    ownerId: team:logos-platform
    ownerType: team
  visibility: package
  annotations:
    logos.ext/source-namespace: logos.seo
    logos.ext/consumed-by: SEO/seo-api (src/ontology.ts)
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §7 R10
    logos.ext/locale-status: Japanese labels are a draft; business terms to be confirmed by the SEO team
spec:
  accessors:
  - accessorId: from
    fromTypeRef: logos.seo.object.seo-anomaly
    apiName: judgmentCondition
    displayName:
      en: Judgment Condition
      ja: 判断条件
    description:
      en: The condition that made the change significant. Exactly one (anomaly.judgmentConditionId).
      ja: 変化を重要と判定した条件。必ず1件（anomaly.judgmentConditionId）。
    returnsTypeRef: logos.seo.object.judgment-condition
    cardinality: '1'
  - accessorId: to
    fromTypeRef: logos.seo.object.judgment-condition
    apiName: anomalies
    displayName:
      en: Anomalies
      ja: 異常
    description:
      en: Anomalies this condition has detected. Empty until it first fires.
      ja: この条件で検出された異常。初めて発火するまでは空。
    returnsTypeRef: logos.seo.object.seo-anomaly
    cardinality: '0..*'
  canonicalDirection:
    fromAccessorId: from
    toAccessorId: to
  relationMode: stored
  security:
    classification: internal
    policyCombining: deny_overrides
    readPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    queryPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
    - relation_change
    recordReleaseRefs: true
    integrityMode: hash_chain
    retentionPolicyRef: logos.shared-core.policy.audit-retention-7y
