# Loaded at startup by SEO/seo-api; checked against the API code.
apiVersion: logos.ontology/v0.0.1
kind: RelationType
metadata:
  id: logos.seo.relation.cause-explains-anomaly
  apiName: CauseExplainsAnomaly
  displayName:
    en: Cause hypothesis explains anomaly
    ja: 原因仮説が異常を説明
  description:
    en: Cause hypothesis explains anomaly (R11).
    ja: 原因仮説が異常を説明（R11）。
  version: 0.0.1
  owner:
    ownerId: team:logos-platform
    ownerType: team
  visibility: package
  annotations:
    logos.ext/source-namespace: logos.seo
    logos.ext/consumed-by: SEO/seo-api (src/ontology.ts)
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §7 R11
    logos.ext/locale-status: Japanese labels are a draft; business terms to be confirmed by the SEO team
spec:
  accessors:
  - accessorId: from
    fromTypeRef: logos.seo.object.cause-hypothesis
    apiName: anomaly
    displayName:
      en: Anomaly
      ja: 異常
    description:
      en: The anomaly this hypothesis explains. Exactly one (causeHypothesis.anomalyId).
      ja: この仮説が説明する異常。必ず1件（causeHypothesis.anomalyId）。
    returnsTypeRef: logos.seo.object.seo-anomaly
    cardinality: '1'
  - accessorId: to
    fromTypeRef: logos.seo.object.seo-anomaly
    apiName: causeHypothesis
    displayName:
      en: Cause Hypothesis
      ja: 原因仮説
    description:
      en: The one cause hypothesis of the anomaly, proposed together with it by SuggestCause.
      ja: 異常に対する唯一の原因仮説。SuggestCauseで異常と同時に提案される。
    returnsTypeRef: logos.seo.object.cause-hypothesis
    cardinality: '0..1'
  canonicalDirection:
    fromAccessorId: from
    toAccessorId: to
  relationMode: stored
  security:
    classification: internal
    policyCombining: deny_overrides
    readPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    queryPolicyRefs:
    - logos.shared-core.policy.authenticated-internal-reader
    agentRestrictions:
      defaultAgentMode: propose_only
      externalWriteAllowed: false
  audit:
    enabled: true
    eventCategories:
    - relation_change
    recordReleaseRefs: true
    integrityMode: hash_chain
    retentionPolicyRef: logos.shared-core.policy.audit-retention-7y
