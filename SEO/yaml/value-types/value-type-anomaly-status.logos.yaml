# Loaded at startup by SEO/seo-api; checked against the API code.
apiVersion: logos.ontology/v0.0.1
kind: ValueType
metadata:
  id: logos.seo.value.anomaly-status
  apiName: AnomalyStatus
  displayName:
    en: Anomaly Status
    ja: 異常ステータス
  description:
    en: Governed lifecycle of an SEO anomaly. The system creates it as Detected; the SEO team moves it forward.
    ja: SEO異常のライフサイクル。システムがDetectedで作成し、SEO担当が進める。
  version: 0.0.1
  owner:
    ownerId: team:logos-platform
    ownerType: team
  visibility: package
  annotations:
    logos.ext/source-namespace: logos.seo
    logos.ext/consumed-by: SEO/seo-api (src/ontology.ts)
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §8
    logos.ext/locale-status: Japanese labels are a draft; business terms to be confirmed by the SEO team
spec:
  valueKind: enumerated_text
  enumeratedValues:
  - value: Detected
    displayName:
      en: Detected
      ja: 検出
  - value: Triaged
    displayName:
      en: Triaged
      ja: トリアージ済
  - value: CountermeasureAssigned
    displayName:
      en: Countermeasure assigned
      ja: 対策割当済
  - value: Resolved
    displayName:
      en: Resolved
      ja: 解決
  - value: Dismissed
    displayName:
      en: Dismissed
      ja: 却下
  initialValue: Detected
  transitions:
    Detected:
    - Triaged
    Triaged:
    - CountermeasureAssigned
    CountermeasureAssigned:
    - Resolved
    - Dismissed
    Resolved: []
    Dismissed: []
