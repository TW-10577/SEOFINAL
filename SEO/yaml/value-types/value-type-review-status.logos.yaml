# Loaded at startup by SEO/seo-api; checked against the API code.
apiVersion: logos.ontology/v0.0.1
kind: ValueType
metadata:
  id: logos.seo.value.review-status
  apiName: ReviewStatus
  displayName:
    en: Human Review Status
    ja: 確認ステータス
  description:
    en: Human review status of a cause hypothesis, set by the SEO team.
    ja: 原因仮説に対するSEO担当の確認ステータス。
  version: 0.0.1
  owner:
    ownerId: team:logos-platform
    ownerType: team
  visibility: package
  annotations:
    logos.ext/source-namespace: logos.seo
    logos.ext/consumed-by: SEO/seo-api (src/ontology.ts)
    logos.ext/design-source: LOGOS_SEO_Ontology_Design.md_.md §8
    logos.ext/locale-status: Japanese labels are a draft; business terms to be confirmed by the SEO team
spec:
  valueKind: enumerated_text
  enumeratedValues:
  - value: NotReviewed
    displayName:
      en: Not reviewed
      ja: 未確認
  - value: Confirmed
    displayName:
      en: Confirmed
      ja: 確認済
  - value: Rejected
    displayName:
      en: Rejected
      ja: 否認
  - value: NeedsMoreEvidence
    displayName:
      en: Needs more evidence
      ja: 追加根拠が必要
  initialValue: NotReviewed
  transitions:
    NotReviewed:
    - Confirmed
    - Rejected
    - NeedsMoreEvidence
    Confirmed: []
    Rejected: []
    NeedsMoreEvidence: []
